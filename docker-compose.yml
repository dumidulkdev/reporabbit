services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reporabbit
      POSTGRES_PASSWORD: reporabbit
      POSTGRES_DB: reporabbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporabbit -d reporabbit"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://reporabbit:reporabbit@db:5432/reporabbit
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      STALE_THRESHOLD_DAYS: ${STALE_THRESHOLD_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "4321:4321"

volumes:
  pgdata:
